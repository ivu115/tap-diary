<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タップ日記">
<title>タップ日記</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="nav-btn" id="prev" aria-label="前の日">‹</button>
  <div class="date-wrap">
    <div id="date-label" class="date-label"></div>
    <div id="status" class="status"></div>
  </div>
  <button class="nav-btn" id="next" aria-label="次の日">›</button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="today" class="active">📝<span>日記</span></button>
  <button data-tab="history">📚<span>履歴</span></button>
  <button data-tab="settings">⚙️<span>設定</span></button>
</nav>

<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
